name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and development tools
        run: python -m pip install -e '.[dev,plot,gym]' wheel
      - name: Test
        run: python -m pytest
      - name: Check documentation and examples
        run: python scripts/check_docs.py --examples --cli
      - name: Check style
        if: matrix.python-version == '3.12'
        run: |
          ruff check src tests examples scripts
          ruff format --check src tests examples scripts
      - name: Build distributions
        if: matrix.python-version == '3.12'
        run: python -m build --no-isolation

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install lockfile tooling
        run: python -m pip install pip-tools
      - name: Build and test standalone study container
        env:
          EWS_TEST_REVISION: ${{ github.sha }}
        run: >-
          python scripts/check_container.py --revision "$EWS_TEST_REVISION"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "experiments-wo-stress"
version = "0.1.0"
description = "Reproducible numerical experiments with resumable runs and independent analysis."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "PyYAML>=6.0", "rich>=13.7"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
gym = ["gymnasium>=1.0"]
dev = ["pytest>=8", "ruff>=0.9", "build>=1.2", "setuptools>=68", "wheel>=0.41"]

[project.scripts]
ews = "experiments_wo_stress.cli:main"

[project.urls]
Repository = "https://github.com/m1gwings/experiments-wo-stress"
Issues = "https://github.com/m1gwings/experiments-wo-stress/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
experiments_wo_stress = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
